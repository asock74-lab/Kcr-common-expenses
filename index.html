<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>KCR Expenses App</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json" />

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0E4A3F" />

<!-- iOS Safari (kept for cross-platform "Add to Home Screen" support) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KCR Expenses" />

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
  :root{
    --teal:#0E4A3F; --teal-dark:#093329; --gold:#C9A227; --sand:#F6F1E6;
    --ink:#1C2B27; --muted:#8A9591; --line:#EEE6D3; --danger:#B5453B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)!important;
    box-shadow:0 0 0 3px rgba(14,74,63,0.12);}
  button{cursor:pointer;}
  ::-webkit-scrollbar{width:6px;height:6px;}

  .header{background:var(--teal);color:#fff;padding:18px 20px 22px;}
  .header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;}
  .brand-title{font-family:Georgia,'Times New Roman',serif;font-size:19px;letter-spacing:.3px;}
  .brand-sub{font-size:12px;color:#BFD8CF;letter-spacing:.5px;margin-top:1px;}

  .container{max-width:480px;margin:0 auto;padding:16px 16px 100px;}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(28,43,39,.08);
    border:1px solid var(--line);margin-bottom:14px;}
  .section-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--teal-dark);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .section-title:before{content:'';width:14px;height:2px;background:var(--gold);display:inline-block;}

  .field{display:block;margin-bottom:16px;}
  .field-label{font-size:12.5px;font-weight:600;color:#5A6B65;letter-spacing:.3px;text-transform:uppercase;}
  .field-input{width:100%;padding:11px 12px;font-size:15.5px;border:1.5px solid #DCD3BF;
    border-radius:10px;background:#fff;color:var(--ink);margin-top:6px;}
  .field-input.error{border-color:var(--danger);}
  textarea.field-input{resize:none;}

  .btn-primary{width:100%;background:var(--teal);color:#fff;border:none;border-radius:14px;
    padding:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;
    gap:8px;box-shadow:0 6px 16px rgba(14,74,63,.3);}
  .btn-outline{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;
    border:1.5px solid var(--teal);color:var(--teal-dark);border-radius:12px;padding:12px;
    font-size:13.5px;font-weight:700;}
  .btn-ghost{background:none;border:none;color:var(--teal);font-size:14px;font-weight:600;padding:4px 0;
    display:flex;align-items:center;gap:4px;}

  .stat-row{display:flex;gap:12px;margin-bottom:18px;}
  .stat-card{flex:1;background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line);}
  .stat-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .stat-value{font-size:22px;font-weight:700;color:var(--teal-dark);margin-top:4px;}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13.5px;}

  .pay-chip{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;
    border:1.5px solid #DCD3BF;background:#fff;color:#5A6B65;}
  .pay-chip.active{border:1.5px solid var(--teal);background:rgba(14,74,63,.08);color:var(--teal-dark);}

  .expense-item{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px;}
  .expense-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .expense-actions{display:flex;gap:8px;margin-top:10px;border-top:1px solid #F1EBDC;padding-top:8px;}
  .row-btn{display:flex;align-items:center;gap:5px;background:none;border:none;font-size:12.5px;
    font-weight:600;color:#5A6B65;padding:4px 8px 4px 0;}

  .catrow{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
    background:#FBF8F1;border-radius:10px;margin-bottom:8px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E7DFCB;
    z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.05); padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav-inner{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 4px;}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    padding:6px 8px;color:var(--muted);font-size:10.5px;font-weight:500;}
  .navbtn.active{color:var(--teal);font-weight:700;}
  .navbtn svg{width:19px;height:19px;}
  .navbtn.fab .fab-circle{width:40px;height:40px;border-radius:50%;background:var(--teal);
    display:flex;align-items:center;justify-content:center;margin-top:-18px;
    box-shadow:0 4px 10px rgba(14,74,63,.35);}
  .navbtn.fab svg{width:20px;height:20px;stroke:#fff;}

  .overlay{position:fixed;inset:0;background:rgba(9,51,41,.75);display:flex;align-items:center;
    justify-content:center;z-index:300;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:320px;width:100%;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:14px;}

  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--teal-dark);
    color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;
    box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:200;white-space:nowrap;}
  .toast.error{background:var(--danger);}

  .receipt-thumb{position:relative;display:inline-block;}
  .receipt-thumb img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #DCD3BF;}
  .receipt-remove{position:absolute;top:-7px;right:-7px;background:var(--danger);border:2px solid #fff;
    border-radius:50%;width:22px;height:22px;color:#fff;display:flex;align-items:center;justify-content:center;}
  .attach-btn{display:flex;align-items:center;gap:7px;padding:10px 14px;border:1.5px dashed #C6BCA0;
    border-radius:10px;background:#FBF8F1;color:#5A6B65;font-size:13.5px;font-weight:500;}

  @media print{
    .header,.bottomnav,.no-print{display:none!important;}
    body{background:#fff;}
  }
</style>
</head>

<script>
/* ---------------- data / storage ---------------- */
const DEFAULT_CATEGORIES = ["Salary","Common EB","Mamul","Pest Control","Diesel","Pool Maintenance","Miscellaneous"];
const PAYMENT_MODES = ["Cash","UPI","Bank Transfer","Card","Other"];
const CAT_COLORS = ["#0E4A3F","#C9A227","#7A9E7E","#B5453B","#8C6D46","#3E6E8E","#9B6B9E","#5C7A5E","#A65D3B"];

const state = {
  tab: "dashboard",
  expenses: JSON.parse(localStorage.getItem("kcr-expenses") || "[]"),
  categories: JSON.parse(localStorage.getItem("kcr-categories") || "null") || DEFAULT_CATEGORIES.slice(),
  editingId: null,
  historyFilter: { search: "", cat: "All", date: "" },
  reportMonth: null,
};

function saveExpenses(){ localStorage.setItem("kcr-expenses", JSON.stringify(state.expenses)); }
function saveCategories(){ localStorage.setItem("kcr-categories", JSON.stringify(state.categories)); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function money(n){ return "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function catColor(cat){ const i = state.categories.indexOf(cat); return CAT_COLORS[i>=0 ? i%CAT_COLORS.length : 0]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function monthLabel(m){ return new Date(m+"-02").toLocaleString("en-IN",{month:"long",year:"numeric"}); }

function showToast(message, type){
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast ${type==='error'?'error':''}">${esc(message)}</div>`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ root.innerHTML=""; }, 2200);
}

/* ---------------- image compression ---------------- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim=480; let {width,height}=img;
        if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
        else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
        const canvas=document.createElement("canvas"); canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",0.55));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ---------------- charts ---------------- */
let chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }
function drawPieChart(canvasId, dataPairs){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  chartInstances[canvasId] = new Chart(ctx, {
    type: "doughnut",
    data: { labels: dataPairs.map(d=>d.name), datasets:[{ data: dataPairs.map(d=>d.value), backgroundColor: dataPairs.map(d=>catColor(d.name)), borderWidth:2, borderColor:"#fff" }]},
    options: { plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => c.label + ": " + money(c.parsed) } } }, cutout:"58%", maintainAspectRatio:false }
  });
}
function drawBarChart(canvasId, dataPairs){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  chartInstances[canvasId] = new Chart(ctx, {
    type:"bar",
    data:{ labels: dataPairs.map(d=>d.name), datasets:[{ data: dataPairs.map(d=>d.value), backgroundColor: dataPairs.map(d=>catColor(d.name)), borderRadius:6 }]},
    options:{ indexAxis:"y", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => money(c.parsed.x) } } },
      scales:{ x:{ display:false }, y:{ ticks:{ font:{size:11} }, grid:{display:false} } }, maintainAspectRatio:false }
  });
}

/* ---------------- Dashboard ---------------- */
function monthCatTotals(monthKey){
  const monthExpenses = state.expenses.filter(e=>e.date.slice(0,7)===monthKey);
  const map={};
  monthExpenses.forEach(e=>{ map[e.category]=(map[e.category]||0)+Number(e.amount); });
  return state.categories.map(c=>({name:c,value:map[c]||0})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value);
}

function renderDashboard(){
  const today = todayStr(); const thisMonth = today.slice(0,7);
  const lm = new Date(); lm.setMonth(lm.getMonth()-1); const lastMonth = lm.toISOString().slice(0,7);

  const todayExpenses = state.expenses.filter(e=>e.date===today);
  const monthExpenses = state.expenses.filter(e=>e.date.slice(0,7)===thisMonth);
  const lastMonthTotal = state.expenses.filter(e=>e.date.slice(0,7)===lastMonth).reduce((s,e)=>s+Number(e.amount),0);

  const todayTotal = todayExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const monthTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const delta = lastMonthTotal>0 ? (((monthTotal-lastMonthTotal)/lastMonthTotal)*100).toFixed(0) : null;

  const catTotals = monthCatTotals(thisMonth);
  const highest = catTotals[0];

  return `
    <button class="btn-primary" id="btn-add-expense" style="margin-bottom:18px;">${ICONS.add} Add Expense</button>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Today</div>

        <div class="stat-sub">${todayExpenses.length} transaction${todayExpenses.length!==1?'s':''}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value">${money(monthTotal)}</div>
        <div class="stat-sub" style="color:${delta>0?'#B5453B':'#2F7A4F'}">${delta===null?'No prior month data':(delta>0?'+':'')+delta+'% vs last month'}</div>
      </div>
    </div>

    ${highest ? `
    <div class="card" style="background:var(--teal-dark);border:none;color:#fff;">
      <div class="stat-label" style="color:#BFD8CF;">Highest Category This Month</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
        <div style="font-family:Georgia,serif;font-size:18px;">${esc(highest.name)}</div>
        <div style="font-size:18px;font-weight:700;color:var(--gold);">${money(highest.value)}</div>
      </div>
    </div>` : ""}

    <div class="section-title">Category Totals · ${monthLabel(thisMonth)}</div>

      ${catTotals.length===0 ? `<div class="empty">${ICONS.alert}<div style="margin-top:8px;">No expenses logged this month yet.</div></div>` : `
        <div style="height:180px;margin-bottom:8px;"><canvas id="dashPie"></canvas></div>
        <div>
          ${catTotals.map(c=>`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid #F1EBDC;">
              <div style="display:flex;align-items:center;gap:8px;font-size:14px;">
                <span class="dot" style="background:${catColor(c.name)}"></span>${esc(c.name)}
              </div>
              <div style="font-weight:600;font-size:14px;">${money(c.value)}</div>
            </div>`).join("")}
        </div>
      `}
    </div>
  `;
}
function renderDashboardChart(){
  const thisMonth = todayStr().slice(0,7);
  const catTotals = monthCatTotals(thisMonth);
  if(catTotals.length) drawPieChart("dashPie", catTotals);
}

/* ---------------- Reports ---------------- */
function getMonthsList(){
  const set = new Set(state.expenses.map(e=>e.date.slice(0,7)));
  set.add(todayStr().slice(0,7));
  return Array.from(set).sort().reverse();
}
function renderReports(){
  const months = getMonthsList();
  if(!state.reportMonth || !months.includes(state.reportMonth)) state.reportMonth = months[0];
  const month = state.reportMonth;
  const monthExpenses = state.expenses.filter(e=>e.date.slice(0,7)===month);
  const total = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const pd = new Date(month+"-02"); pd.setMonth(pd.getMonth()-1);
  const prevMonth = pd.toISOString().slice(0,7);
  const prevTotal = state.expenses.filter(e=>e.date.slice(0,7)===prevMonth).reduce((s,e)=>s+Number(e.amount),0);
  const catTotals = monthCatTotals(month);
  const daysInMonth = new Date(Number(month.slice(0,4)), Number(month.slice(5,7)), 0).getDate();
  const avgDaily = total/daysInMonth;
  const highest = catTotals[0];

  return `
    <div class="card">
      <label class="field" style="margin-bottom:0;">
        <div class="field-label">Report Month</div>
        <select class="field-input" id="f-report-month">
          ${months.map(m=>`<option value="${m}" ${m===month?'selected':''}>${monthLabel(m)}</option>`).join("")}
        </select>
      </label>
    </div>

    <div class="card" id="kcr-report">
      <div class="section-title">${monthLabel(month)} Summary</div>
      ${monthExpenses.length===0 ? `<div class="empty">${ICONS.alert}<div style="margin-top:8px;">No expenses recorded for this month.</div></div>` : `
        ${summaryRow("Total Common Expenses", money(total), true)}
        ${summaryRow("Number of Transactions", monthExpenses.length)}
        ${summaryRow("Average Daily Expense", money(avgDaily))}
        ${summaryRow("Highest Category", highest ? `${esc(highest.name)} (${money(highest.value)})` : "—")}
        ${summaryRow("Vs. Previous Month", prevTotal ? `${(((total-prevTotal)/prevTotal)*100).toFixed(0)}%` : "No prior data")}
        <div style="height:1px;background:#F1EBDC;margin:12px 0;"></div>
        <div style="font-size:12.5px;font-weight:700;color:#5A6B65;text-transform:uppercase;margin-bottom:8px;">Category-wise Totals</div>
        <div style="height:160px;margin-bottom:6px;"><canvas id="reportBar"></canvas></div>
      `}
    </div>

    ${monthExpenses.length>0 ? `
    <div style="display:flex;gap:10px;" class="no-print">
      <button class="btn-outline" id="btn-export-csv">${ICONS.download} Export CSV</button>
      <button class="btn-outline" id="btn-export-pdf">${ICONS.reports} Export PDF</button>
    </div>` : ""}
  `;
}
function summaryRow(label,value,bold){
  return `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:${bold?'15.5px':'13.5px'};">
    <span style="color:#5A6B65;">${esc(label)}</span><span style="font-weight:${bold?700:600};color:var(--teal-dark);">${value}</span></div>`;
}
function renderReportsChart(){
  const catTotals = monthCatTotals(state.reportMonth);
  if(catTotals.length) drawBarChart("reportBar", catTotals);
}
function exportCSV(){
  const month = state.reportMonth;
  const monthExpenses = state.expenses.filter(e=>e.date.slice(0,7)===month);
  const total = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const rows = [["Date","Category","Description","Paid By","Payment Mode","Amount"]];
  monthExpenses.forEach(e=>rows.push([e.date,e.category,e.description||"",e.paidBy||"",e.paymentMode,e.amount]));
  rows.push([]); rows.push(["Total","","","","",total]);
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=`KCR-Expenses-${month}.csv`; a.click();
  URL.revokeObjectURL(url);
}

  document.getElementById("confirm-overlay").onclick = ()=> document.getElementById("modal-root").innerHTML="";
  document.getElementById("confirm-cancel").onclick = ()=> document.getElementById("modal-root").innerHTML="";
  document.getElementById("confirm-ok").onclick = ()=>{ document.getElementById("modal-root").innerHTML=""; onConfirm(); };
}
function showReceipt(src){
  document.getElementById("modal-root").innerHTML = `
    <div class="overlay" id="receipt-overlay">
      <img src="${src}" style="max-width:90%;max-height:85%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);" />
    </div>`;
  document.getElementById("receipt-overlay").onclick = ()=> document.getElementById("modal-root").innerHTML="";
}

/* ---------------- event wiring ---------------- */
function attachHandlers(){
  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.onclick = ()=>{ state.editingId=null; state.tab=btn.dataset.nav; render(); };
  });

  if(state.tab==="dashboard"){
    const b = document.getElementById("btn-add-expense");
    if(b) b.onclick = ()=>{ state.editingId=null; state.tab="add"; render(); };
  }

  if(state.tab==="add"){
    document.getElementById("btn-cancel-add").onclick = ()=>{
      const wasEditing = !!state.editingId; addExpenseDraft=null; state.editingId=null;
      state.tab = wasEditing ? "history" : "dashboard"; render();
    };
    const sync = ()=>{
      addExpenseDraft.date = document.getElementById("f-date").value;
      addExpenseDraft.category = document.getElementById("f-category").value;
      addExpenseDraft.amount = document.getElementById("f-amount").value;
      addExpenseDraft.description = document.getElementById("f-description").value;
      addExpenseDraft.paidBy = document.getElementById("f-paidby").value;
    };
    ["f-date","f-category","f-amount","f-description","f-paidby"].forEach(id=>{
      const el = document.getElementById(id);
      el.addEventListener("input", sync);
      el.addEventListener("change", sync);
    });
    document.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.onclick = ()=>{ addExpenseDraft.paymentMode = btn.dataset.mode; render(); };
    });
    const attachBtn = document.getElementById("btn-attach");
    if(attachBtn) attachBtn.onclick = ()=> document.getElementById("f-file").click();
    const removeBtn = document.getElementById("btn-remove-receipt");
    if(removeBtn) removeBtn.onclick = ()=>{ addExpenseDraft.receipt=null; render(); };
    document.getElementById("f-file").onchange = async (e)=>{
      const file = e.target.files && e.target.files[0]; if(!file) return;
      try{ addExpenseDraft.receipt = await compressImage(file); render(); }
      catch{ showToast("Couldn't read that photo","error"); }
    };
    document.getElementById("btn-save-expense").onclick = ()=>{
      sync();
      const d = addExpenseDraft;
      const amt = parseFloat(d.amount);
      let hasErr=false;
      if(!d.date){ document.getElementById("f-date").classList.add("error"); hasErr=true; }
      if(!d.category){ hasErr=true; }
      if(!d.amount || isNaN(amt) || amt<=0){ document.getElementById("f-amount").classList.add("error"); hasErr=true; }
      if(hasErr){ showToast("Please fix the highlighted fields","error"); return; }

      const now = new Date().toISOString();
      if(state.editingId){
        state.expenses = state.expenses.map(x=> x.id===state.editingId ? {...x, date:d.date, category:d.category, amount:amt, description:d.description.trim(), paidBy:d.paidBy.trim(), paymentMode:d.paymentMode, receipt:d.receipt, updatedAt:now} : x);
        showToast("Expense updated");
      } else {
        state.expenses = [{ id:uid(), date:d.date, category:d.category, amount:amt, description:d.description.trim(), paidBy:d.paidBy.trim(), paymentMode:d.paymentMode, receipt:d.receipt, createdAt:now, updatedAt:now }, ...state.expenses];
        showToast("Expense saved");
      }
      saveExpenses();
      addExpenseDraft=null; state.editingId=null; state.tab="history"; render();
    };
  }

  if(state.tab==="history"){
    document.getElementById("f-search").oninput = (e)=>{ state.historyFilter.search=e.target.value; render(); document.getElementById("f-search").focus(); document.getElementById("f-search").selectionStart = document.getElementById("f-search").value.length; };
    document.getElementById("f-filter-cat").onchange = (e)=>{ state.historyFilter.cat=e.target.value; render(); };
    document.getElementById("f-filter-date").onchange = (e)=>{ state.historyFilter.date=e.target.value; render(); };
    const clearBtn = document.getElementById("btn-clear-filters");
    if(clearBtn) clearBtn.onclick = ()=>{ state.historyFilter.cat="All"; state.historyFilter.date=""; render(); };
    document.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.onclick = ()=>{ addExpenseDraft=null; state.editingId=btn.dataset.edit; state.tab="add"; render(); };
    });
    document.querySelectorAll("[data-delete]").forEach(btn=>{
      btn.onclick = ()=>{ const id=btn.dataset.delete; showConfirm("Delete this expense? This can't be undone.", ()=>{
        state.expenses = state.expenses.filter(x=>x.id!==id); saveExpenses(); render(); showToast("Expense deleted");
      });};
    });
    document.querySelectorAll("[data-view-receipt]").forEach(btn=>{
      btn.onclick = ()=>{ const e = state.expenses.find(x=>x.id===btn.dataset.viewReceipt); if(e) showReceipt(e.receipt); };
    });
  }

  if(state.tab==="reports"){
    document.getElementById("f-report-month").onchange = (e)=>{ state.reportMonth=e.target.value; render(); };
    const csvBtn = document.getElementById("btn-export-csv");
    if(csvBtn) csvBtn.onclick = exportCSV;
    const pdfBtn = document.getElementById("btn-export-pdf");
    if(pdfBtn) pdfBtn.onclick = ()=> window.print();
  }

  if(state.tab==="settings"){
    document.getElementById("btn-add-cat").onclick = ()=>{
      const input = document.getElementById("f-new-cat");
      const name = input.value.trim();
      if(!name) return;
      if(state.categories.some(c=>c.toLowerCase()===name.toLowerCase())){ showToast("That category already exists","error"); return; }
      state.categories = [...state.categories, name]; saveCategories(); showToast("Category added"); render();
    };
    document.getElementById("f-new-cat").onkeydown = (e)=>{ if(e.key==="Enter") document.getElementById("btn-add-cat").click(); };
    document.querySelectorAll("[data-remove-cat]").forEach(btn=>{
      btn.onclick = ()=>{
        const c = btn.dataset.removeCat;
        if(DEFAULT_CATEGORIES.includes(c)){ showToast("Default categories can't be removed","error"); return; }
        state.categories = state.categories.filter(x=>x!==c); saveCategories(); showToast("Category removed"); render();
      };
    });
  }
}

render();

/* ---------------- PWA: service worker registration ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("service-worker.js")
      .then((reg) => {
        console.log("KCR Expenses: service worker registered", reg.scope);
      })
      .catch((err) => {
        console.error("KCR Expenses: service worker registration failed", err);
      });
  });
}
</script>
